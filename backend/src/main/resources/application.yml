spring:
  application:
    name: securescore
  datasource:
    url: jdbc:mysql://localhost:3306/securescore?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:A@yush1512}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

scanner:
  timeout:
    connect-ms: 10000
    read-ms: 15000
  max-redirects: 5
  max-response-size-bytes: 524288
  thread-pool:
    core-size: 8
    max-size: 16
    queue-capacity: 50
  overall-timeout-seconds: 60

rate-limiter:
  max-requests-per-window: 10
  window-seconds: 60

logging:
  level:
    com.securescore: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
